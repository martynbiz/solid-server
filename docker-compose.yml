services:
  solid-server:
    image: solidproject/community-server:latest
    container_name: solid-server
    restart: unless-stopped

    # CSS rejects any request that doesn't match its configured base URL, so
    # this MUST be your real public address in production (see .env.example).
    environment:
      CSS_BASE_URL: ${CSS_BASE_URL:-http://localhost:3000/}

    ports:
      - "${PORT:-3000}:3000"

    volumes:
      - ./data:/data
